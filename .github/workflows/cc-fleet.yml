name: Qwen AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Какая задача для AI-агента?"
        required: true
        type: string
        default: "Исправь отображение символа рубля в списке АЗС"
      base_branch:
        description: "В какую ветку создавать Pull Request?"
        required: true
        type: string
        default: main
      model:
        description: "Имя модели Qwen (qwen3-coder-plus, qwen3-max, qwen-max)"
        required: true
        type: string
        default: qwen3-coder-plus
      region:
        description: "Регион ключа: china или international"
        required: true
        type: choice
        options:
          - international
          - china
        default: international

permissions:
  contents: write
  pull-requests: write

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run AI Agent (edits + compile + auto-repair)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_MODEL: ${{ inputs.model }}
          TASK: ${{ inputs.task }}
          REGION: ${{ inputs.region }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
        run: |
          cat > ai_agent.py << 'PYEOF'
          import os
          import sys
          import json
          import subprocess
          import requests

          def is_protected(path):
              return (path.startswith(".github") or path.endswith(".gradle")
                      or path.endswith(".gradle.kts") or path.endswith(".properties")
                      or path.endswith(".md"))

          def call_model(url, headers, model, prompt):
              payload = {
                  "model": model,
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.1
              }
              response = requests.post(url, headers=headers, json=payload, timeout=300)
              print(f"HTTP статус: {response.status_code}")
              if response.status_code != 200:
                  print(f"Ответ сервера: {response.text[:800]}")
              response.raise_for_status()
              return response.json()["choices"][0]["message"]["content"]

          def extract_json(content):
              start = content.find("[")
              end = content.rfind("]") + 1
              if start >= 0 and end > start:
                  return json.loads(content[start:end])
              return None

          def apply_edits(path, edits):
              with open(path, 'r', encoding='utf-8') as f:
                  text = f.read()
              applied = 0
              for i, edit in enumerate(edits):
                  search = edit.get("search", "")
                  replace = edit.get("replace", "")
                  if not search:
                      continue
                  count = text.count(search)
                  if count == 1:
                      text = text.replace(search, replace)
                      applied += 1
                      print(f"  ✓ правка {i + 1} применена")
                  elif count == 0:
                      print(f"  ⚠ правка {i + 1}: SEARCH не найден — пропущена")
                  else:
                      print(f"  ⚠ правка {i + 1}: SEARCH найден {count} раз — пропущена")
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)
              return applied

          def apply_changes(changes):
              total = 0
              touched = []
              for change in changes:
                  path = change.get("path")
                  if not path:
                      continue
                  if is_protected(path):
                      print(f"  ⛔ Пропускаю защищённый файл: {path}")
                      continue
                  if "edits" in change and os.path.exists(path):
                      print(f"Обрабатываю правки: {path}")
                      total += apply_edits(path, change["edits"])
                      touched.append(path)
                  elif change.get("action") in ("create", "update") and "content" in change:
                      print(f"Обрабатываю полную запись: {path}")
                      os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(change["content"])
                      total += 1
                      touched.append(path)
              return total, touched

          def read_files(paths, limit=12000):
              blocks = []
              for path in paths:
                  try:
                      with open(path, 'r', encoding='utf-8') as f:
                          blocks.append(f"=== {path} ===\n{f.read()[:limit]}\n")
                  except Exception:
                      pass
              return "".join(blocks)

          def verify_project():
              """Компиляция + юнит-тесты. Возвращает (ok: bool, output: str)."""
              subprocess.run(["chmod", "+x", "./gradlew"], check=False)
              print("🔨 Компиляция :app:compileDebugKotlin ...")
              p1 = subprocess.run(
                  ["./gradlew", ":app:compileDebugKotlin", "--console=plain"],
                  capture_output=True, text=True)
              out1 = (p1.stdout or "") + (p1.stderr or "")
              if p1.returncode != 0:
                  return False, out1

              print("🧪 Юнит-тесты :app:testDebugUnitTest ...")
              p2 = subprocess.run(
                  ["./gradlew", ":app:testDebugUnitTest", "--console=plain"],
                  capture_output=True, text=True)
              out2 = (p2.stdout or "") + (p2.stderr or "")
              return p2.returncode == 0, out1 + "\n" + out2

          def extract_errors(out):
              lines = [l for l in out.splitlines() if l.strip().startswith("e:")]
              if lines:
                  return "\n".join(lines[:40])
              return out[-3000:]

          def main():
              task = os.getenv("TASK")
              api_key = os.getenv("DASHSCOPE_API_KEY")
              model = os.getenv("QWEN_MODEL", "qwen3-coder-plus")
              region = os.getenv("REGION", "international")

              if not task or not api_key:
                  print("Ошибка: TASK и DASHSCOPE_API_KEY обязательны")
                  sys.exit(1)

              base = (os.getenv("QWEN_BASE_URL") or
                      ("https://dashscope-intl.aliyuncs.com" if region == "international"
                       else "https://dashscope.aliyuncs.com")).rstrip("/")
              if "/chat/completions" in base:
                  url = base
              elif base.endswith("/compatible-mode/v1"):
                  url = base + "/chat/completions"
              else:
                  url = base + "/compatible-mode/v1/chat/completions"

              print(f"Задача: {task}")
              print(f"Модель: {model}")
              print(f"Endpoint: {url}")

              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              }

              context_content = ""
              if os.path.exists("CONTEXT.md"):
                  try:
                      with open("CONTEXT.md", "r", encoding="utf-8") as f:
                          context_content = f.read()
                      print("CONTEXT.md загружен")
                  except Exception:
                      pass

              file_tree = []
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in
                             [".git", "node_modules", ".github", ".gradle", ".idea", "build", "gradle"]]
                  for file in files:
                      path = os.path.join(root, file).replace("\\", "/")
                      if any(path.endswith(ext) for ext in
                             ['.png', '.jpg', '.jpeg', '.gif', '.ico', '.jar', '.apk', '.so', '.bin']):
                          continue
                      file_tree.append(path)

              file_tree_str = "\n".join(sorted(file_tree)[:200])

              target_files = []
              for path in file_tree:
                  if path.endswith(".kt"):
                      name = os.path.basename(path)[:-3]
                      if name and name in task:
                          target_files.append(path)

              if not target_files:
                  target_files = [p for p in file_tree if p.endswith(".kt")][:10]

              target_files = target_files[:6]

              format_rules = """
          ФОРМАТ ОТВЕТА — JSON-массив точечных замен:
          [
            {
              "path": "путь/к/файлу",
              "edits": [
                {
                  "search": "ТОЧНЫЙ фрагмент ТЕКУЩЕГО кода (символ в символ, со всеми отступами)",
                  "replace": "новый фрагмент, на который его заменить"
                }
              ]
            }
          ]
          ПРАВИЛА: search должен совпадать с файлом СИМВОЛ В СИМВОЛ; каждая правка 1–15 строк;
          НЕ возвращай файлы целиком; сохраняй весь код вне задачи; НЕ оставляй пустых тел функций;
          используй только импорты, которые точно существуют в проекте (обычный DropdownMenu вместо
          ExposedDropdownMenuBox/ExposedDropdownMenu). Верни ТОЛЬКО JSON.
          """

              prompt1 = f"""Ты — AI-агент для Android-проекта (Kotlin, Jetpack Compose, Hilt, Room).

          КОНТЕКСТ ПРОЕКТА (раздел "Правила для AI-агента" обязателен):
          {context_content}

          Структура проекта:
          {file_tree_str}

          ТЕКУЩЕЕ ПОЛНОЕ содержимое файлов:
          {read_files(target_files)}

          Задача: {task}
          {format_rules}"""

              print("Отправляю запрос №1 ...")
              try:
                  content = call_model(url, headers, model, prompt1)
              except Exception as e:
                  print(f"Ошибка запроса: {e}")
                  sys.exit(1)

              print(f"Ответ AI (первые 600 символов):\n{content[:600]}")
              changes = extract_json(content)
              if not changes:
                  print("Не удалось найти JSON-массив — PR не будет")
                  with open("compile_status.txt", "w") as f:
                      f.write("fail")
                  sys.exit(0)

              total, touched = apply_changes(changes)
              print(f"Применено правок: {total}")

              if total == 0:
                  print("Ни одна правка не применилась — PR не будет")
                  with open("compile_status.txt", "w") as f:
                      f.write("fail")
                  sys.exit(0)

              MAX_ATTEMPTS = 3  # сколько раз агент пробует довести до зелёного

              ok, out = verify_project()
              attempt = 1
              while not ok and attempt < MAX_ATTEMPTS:
                  attempt += 1
                  errors = extract_errors(out)
                  print(f"❌ Красный статус (попытка {attempt - 1}). Ошибки:\n{errors}")
                  print(f"Отправляю запрос №{attempt} (авто-починка) ...")

                  repair_prompt = f"""Ты — AI-агент для Android-проекта. Твои предыдущие правки СЛОМАЛИ компиляцию или юнит-тесты.

          ТЕКУЩЕЕ содержимое изменённых файлов:
          {read_files(touched)}

          ОШИБКИ:
          {errors}

          Задача (та же): {task}

          Исправь ТОЛЬКО эти ошибки в формате search/replace.
          Не меняй ничего, что не относится к ошибкам. {format_rules}"""

                  try:
                      content_n = call_model(url, headers, model, repair_prompt)
                  except Exception as e:
                      print(f"Ошибка запроса №{attempt}: {e}")
                      break

                  changes_n = extract_json(content_n)
                  if not changes_n:
                      print("Авто-починка не вернула JSON")
                      break

                  applied_n, touched_n = apply_changes(changes_n)
                  print(f"Починка: применено правок {applied_n}")
                  touched = list(set(touched + touched_n))
                  ok, out = verify_project()

              if not ok:
                  print(f"❌ Не удалось довести до зелёного за {MAX_ATTEMPTS} попыток. PR НЕ создаётся.")
                  print(extract_errors(out))
                  with open("compile_status.txt", "w") as f:
                      f.write("fail")
                  sys.exit(0)

              print("✅ Компиляция и юнит-тесты успешны — можно создавать PR")
              with open("compile_status.txt", "w") as f:
                  f.write("ok")

          if __name__ == "__main__":
              main()
          PYEOF

          python ai_agent.py

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TASK: ${{ inputs.task }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail

          if [[ -f compile_status.txt && "$(cat compile_status.txt)" != "ok" ]]; then
            echo "❌ Компиляция не прошла — Pull Request НЕ создаётся."
            rm -f compile_status.txt ai_agent.py
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Нет изменений после работы AI-агента."
            exit 0
          fi

          BRANCH="ai-agent/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          git checkout -b "$BRANCH"

          rm -f ai_agent.py compile_status.txt

          git add -A
          git commit -m "AI Agent: automated changes (compile-verified)"
          git push origin "$BRANCH"

          TITLE="AI Agent: automated changes (compile-verified)"
          BODY=$(printf 'Automated Pull Request by Qwen AI Agent.\n\n**Model:** %s\n\n**Task:**\n%s\n\n✅ Код скомпилирован перед созданием PR.\n' "$MODEL" "$TASK")

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY"
