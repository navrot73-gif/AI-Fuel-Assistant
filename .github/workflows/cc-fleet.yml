name: Qwen AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Какая задача для AI-агента?"
        required: true
        type: string
        default: "Исправь отображение символа рубля в списке АЗС"
      base_branch:
        description: "В какую ветку создавать Pull Request?"
        required: true
        type: string
        default: main
      model:
        description: "Имя модели Qwen (qwen3-coder-plus, qwen3-max, qwen-max)"
        required: true
        type: string
        default: qwen3-coder-plus
      region:
        description: "Регион ключа: china или international"
        required: true
        type: choice
        options:
          - international
          - china
        default: international

permissions:
  contents: write
  pull-requests: write

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run AI Agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_MODEL: ${{ inputs.model }}
          TASK: ${{ inputs.task }}
          REGION: ${{ inputs.region }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
        run: |
          cat > ai_agent.py << 'PYEOF'
          import os
          import sys
          import json
          import requests

          def is_protected(path):
              return (path.startswith(".github") or path.endswith(".gradle")
                      or path.endswith(".gradle.kts") or path.endswith(".properties")
                      or path.endswith(".md"))

          def apply_edits(path, edits):
              with open(path, 'r', encoding='utf-8') as f:
                  text = f.read()
              applied = 0
              for i, edit in enumerate(edits):
                  search = edit.get("search", "")
                  replace = edit.get("replace", "")
                  if not search:
                      continue
                  count = text.count(search)
                  if count == 1:
                      text = text.replace(search, replace)
                      applied += 1
                      print(f"  ✓ правка {i + 1} применена")
                  elif count == 0:
                      print(f"  ⚠ правка {i + 1}: SEARCH не найден — пропущена")
                  else:
                      print(f"  ⚠ правка {i + 1}: SEARCH найден {count} раз (не уникально) — пропущена")
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)
              return applied

          def main():
              task = os.getenv("TASK")
              api_key = os.getenv("DASHSCOPE_API_KEY")
              model = os.getenv("QWEN_MODEL", "qwen3-coder-plus")
              region = os.getenv("REGION", "international")

              if not task or not api_key:
                  print("Ошибка: TASK и DASHSCOPE_API_KEY обязательны")
                  sys.exit(1)

              base = (os.getenv("QWEN_BASE_URL") or
                      ("https://dashscope-intl.aliyuncs.com" if region == "international"
                       else "https://dashscope.aliyuncs.com")).rstrip("/")
              if "/chat/completions" in base:
                  url = base
              elif base.endswith("/compatible-mode/v1"):
                  url = base + "/chat/completions"
              else:
                  url = base + "/compatible-mode/v1/chat/completions"

              print(f"Задача: {task}")
              print(f"Модель: {model}")
              print(f"Endpoint: {url}")

              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              }

              context_content = ""
              if os.path.exists("CONTEXT.md"):
                  try:
                      with open("CONTEXT.md", "r", encoding="utf-8") as f:
                          context_content = f.read()
                      print("CONTEXT.md загружен")
                  except Exception:
                      pass

              file_tree = []
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in
                             [".git", "node_modules", ".github", ".gradle", ".idea", "build", "gradle"]]
                  for file in files:
                      path = os.path.join(root, file).replace("\\", "/")
                      if any(path.endswith(ext) for ext in
                             ['.png', '.jpg', '.jpeg', '.gif', '.ico', '.jar', '.apk', '.so', '.bin']):
                          continue
                      file_tree.append(path)

              file_tree_str = "\n".join(sorted(file_tree)[:200])

              target_files = []
              for path in file_tree:
                  if path.endswith(".kt"):
                      name = os.path.basename(path)[:-3]
                      if name and name in task:
                          target_files.append(path)

              if not target_files:
                  target_files = [p for p in file_tree if p.endswith(".kt")][:10]

              target_files = target_files[:6]

              key_files = []
              for path in target_files:
                  try:
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()[:12000]
                          key_files.append(f"=== {path} ===\n{content}\n")
                  except Exception:
                      pass

              prompt = f"""Ты — AI-агент для Android-проекта (Kotlin, Jetpack Compose, Hilt, Room).

          КОНТЕКСТ ПРОЕКТА (раздел "Правила для AI-агента" обязателен к исполнению):
          {context_content}

          Структура проекта:
          {file_tree_str}

          ТЕКУЩЕЕ ПОЛНОЕ содержимое файлов:
          {"".join(key_files)}

          Задача: {task}

          ФОРМАТ ОТВЕТА — JSON-массив точечных замен:
          [
            {{
              "path": "путь/к/файлу",
              "edits": [
                {{
                  "search": "ТОЧНЫЙ фрагмент ТЕКУЩЕГО кода (скопируй из файла выше, со всеми отступами и символами)",
                  "replace": "новый фрагмент, на который его заменить"
                }}
              ]
            }}
          ]

          ПРАВИЛА ФОРМАТА:
          - search должен совпадать с текущим файлом СИМВОЛ В СИМВОЛ, иначе правка будет пропущена.
          - Каждая правка — минимальная (1–15 строк). НЕ возвращай файлы целиком.
          - Сохраняй весь код, не относящийся к задаче. НЕ оставляй пустых тел функций.
          - Верни ТОЛЬКО JSON, без пояснений и markdown.
          """

              payload = {
                  "model": model,
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.1
              }

              print(f"Отправляю запрос к {url} ...")
              try:
                  response = requests.post(url, headers=headers, json=payload, timeout=300)
                  print(f"HTTP статус: {response.status_code}")
                  if response.status_code != 200:
                      print(f"Ответ сервера: {response.text[:800]}")
                  response.raise_for_status()
              except Exception as e:
                  print(f"Ошибка запроса: {e}")
                  sys.exit(1)

              result = response.json()
              content = result["choices"][0]["message"]["content"]
              print(f"Ответ AI (первые 1000 символов):\n{content[:1000]}")

              try:
                  start = content.find("[")
                  end = content.rfind("]") + 1
                  if start >= 0 and end > start:
                      changes = json.loads(content[start:end])
                  else:
                      print("Не удалось найти JSON-массив в ответе")
                      sys.exit(0)
              except json.JSONDecodeError as e:
                  print(f"Ошибка парсинга JSON: {e}")
                  sys.exit(1)

              total_applied = 0
              for change in changes:
                  path = change.get("path")
                  if not path:
                      continue
                  if is_protected(path):
                      print(f"  ⛔ Пропускаю защищённый файл: {path}")
                      continue

                  if "edits" in change and os.path.exists(path):
                      print(f"Обрабатываю правки: {path}")
                      total_applied += apply_edits(path, change["edits"])
                  elif change.get("action") in ("create", "update") and "content" in change:
                      print(f"Обрабатываю полную запись: {path}")
                      os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(change["content"])
                      total_applied += 1

              print(f"Всего применено правок: {total_applied}")
              print("Готово!")

          if __name__ == "__main__":
              main()
          PYEOF

          python ai_agent.py

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TASK: ${{ inputs.task }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Нет изменений после работы AI-агента."
            exit 0
          fi

          BRANCH="ai-agent/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          git checkout -b "$BRANCH"

          rm -f ai_agent.py

          git add -A
          git commit -m "AI Agent: automated changes"
          git push origin "$BRANCH"

          TITLE="AI Agent: automated changes"
          BODY=$(printf 'Automated Pull Request by Qwen AI Agent.\n\n**Model:** %s\n\n**Task:**\n%s\n' "$MODEL" "$TASK")

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY"
