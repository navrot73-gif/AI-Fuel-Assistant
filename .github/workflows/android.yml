name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN || 'ci-proxy-token-placeholder' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint
        id: lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        id: build
        env:
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN || 'ci-proxy-token-placeholder' }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --stacktrace

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-diagnostic
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: warn

      - name: Quality gate — unit tests must pass
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "::error::Юнит-тесты упали (outcome=${{ steps.test.outcome }}). Смотрите артефакт unit-test-results."
            exit 1
          fi
          echo "Юнит-тесты прошли успешно."
