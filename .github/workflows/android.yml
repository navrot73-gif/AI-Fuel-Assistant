name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run instrumentation tests
        id: android_test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-diagnostic
          path: gradle-build.log
          if-no-files-found: error

      - name: Upload lint report
        if: always() && steps.lint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload unit test results
        if: always() && steps.test.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Upload instrumentation test results
        if: always() && steps.android_test.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: warn

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai-fuel-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail job if any quality gate failed
        if: steps.lint.outcome != 'success' || steps.test.outcome != 'success' || steps.android_test.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "CI quality gate failed:"
          echo "  lint:             ${{ steps.lint.outcome }}"
          echo "  unit tests:       ${{ steps.test.outcome }}"
          echo "  instrumentation:  ${{ steps.android_test.outcome }}"
          echo "  build:            ${{ steps.build.outcome }}"
          exit 1
