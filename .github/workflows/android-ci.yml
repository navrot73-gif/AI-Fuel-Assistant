name: Android CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Create local.properties with empty keys
        run: |
          cat > local.properties <<'EOF'
          DEEPSEEK_API_KEY=
          HUGGINGFACE_TOKEN=
          GIGACHAT_AUTHORIZATION_KEY=
          GIGACHAT_CLIENT_ID=
          GIGACHAT_CLIENT_SECRET=
          YANDEX_API_KEY=
          YANDEX_FOLDER_ID=
          ORS_API_KEY=
          EOF

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
                   path: app/build/reports/lint-results-debug.html

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties with empty keys
        run: |
          cat > local.properties <<'EOF'
          DEEPSEEK_API_KEY=
          HUGGINGFACE_TOKEN=
          GIGACHAT_AUTHORIZATION_KEY=
          GIGACHAT_CLIENT_ID=
          GIGACHAT_CLIENT_SECRET=
          YANDEX_API_KEY=
          YANDEX_FOLDER_ID=
          ORS_API_KEY=
          EOF

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
                   path: app/build/reports/tests/testDebugUnitTest/

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties with empty keys
        run: |
          cat > local.properties <<'EOF'
          DEEPSEEK_API_KEY=
          HUGGINGFACE_TOKEN=
          GIGACHAT_AUTHORIZATION_KEY=
          GIGACHAT_CLIENT_ID=
          GIGACHAT_CLIENT_SECRET=
          YANDEX_API_KEY=
          YANDEX_FOLDER_ID=
          ORS_API_KEY=
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
