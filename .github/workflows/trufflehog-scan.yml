name: truffleHog secret scan

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  trufflehog:
    name: truffleHog scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trufflehog
        # Use the official Go-based binary (trufflesecurity/trufflehog), not the
        # deprecated Python `truffleHog` package which has different behaviour.
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run trufflehog scan
        shell: bash
        run: |
          set -euo pipefail
          # Scan full git history; emit JSON for the artifact, plain text for log.
          trufflehog git "file://$GITHUB_WORKSPACE" \
            --json \
            --no-update \
            > trufflehog-report.json

          # If the JSON report contains at least one verified secret, fail the job.
          if [ -s trufflehog-report.json ] && grep -q '"Verified":true\|"verified":true' trufflehog-report.json; then
            echo "::error::TruffleHog detected verified secrets. See artifact trufflehog-report.json"
            cat trufflehog-report.json
            exit 1
          fi

          echo "No verified secrets found."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          if-no-files-found: ignore
